# TypeScript Domain Instructions
# Purpose: Governance, guidelines, and operational instructions for TypeScript domain

domain:
  id: typescript
  name: TypeScript
  version: "1.0.0"
  description: "Expert TypeScript domain with strict type checking and modern best practices"

# Core Principles
principles:
  - name: "Type Safety First"
    rule: "Use strict TypeScript mode; avoid 'any' type unless absolutely necessary"
    priority: 1
  
  - name: "Explicit Types"
    rule: "Prefer explicit type annotations for function parameters and return types"
    priority: 2
  
  - name: "Type Inference"
    rule: "Leverage TypeScript's type inference where it improves readability"
    priority: 3
  
  - name: "Modern TypeScript"
    rule: "Use latest TypeScript features: template literal types, satisfies, const assertions"
    priority: 4

# Supported Versions
versions:
  current: "5.3+"
  minimum_supported: "5.0"
  strict_mode: true

# Domain-Specific Knowledge
foundational_concepts:
  basic_types:
    - "Primitives: string, number, boolean, null, undefined, symbol, bigint"
    - "Arrays and tuples"
    - "Objects and interfaces"
    - "Enums"
    - "Union and intersection types"
  
  advanced_types:
    - "Generic types"
    - "Conditional types"
    - "Mapped types"
    - "Template literal types"
    - "Utility types: Partial, Required, Pick, Omit, etc."
  
  type_guards:
    - "typeof checks"
    - "instanceof checks"
    - "Custom type predicates"
    - "Discriminated unions"
  
  decorators:
    - "Class decorators"
    - "Method decorators"
    - "Property decorators"
    - "Parameter decorators"
  
  configuration:
    - "tsconfig.json options"
    - "Strict mode flags"
    - "Module resolution"
    - "Path aliases"

# Tool Configuration
tools:
  url_lookup:
    enabled: true
    sources:
      - "TypeScript Official Docs"
      - "TypeScript GitHub"
      - "TypeScript Playground"
      - "Definitely Typed"
    usage_guidelines:
      - "Look up type definitions"
      - "Find utility type usage"
      - "Check compiler options"
      - "Verify type compatibility"
  
  code_analyzer:
    enabled: true
    capabilities:
      - "Type checking"
      - "Linting with ESLint + typescript-eslint"
      - "Type coverage analysis"
      - "Dead code detection"
    usage_guidelines:
      - "Validate type correctness"
      - "Check for type errors"
      - "Identify unsafe type usage"

# Inference Guidelines
inference:
  input_processing:
    - "Parse TypeScript syntax"
    - "Identify type requirements"
    - "Extract generic constraints"
    - "Recognize patterns"
  
  reasoning_steps:
    - "Determine appropriate types"
    - "Apply type inference rules"
    - "Use utility types when beneficial"
    - "Add type guards where needed"
  
  output_formatting:
    - "Include explicit return types for functions"
    - "Use type aliases for complex types"
    - "Add JSDoc comments for documentation"
    - "Format with Prettier"
  
  validation:
    - "Ensure type safety"
    - "Check for 'any' usage"
    - "Verify generic constraints"
    - "Validate type guards"

# Code Generation Guidelines
code_generation:
  structure:
    - "Define types/interfaces before implementation"
    - "Use type aliases for reusable types"
    - "Export types that will be used externally"
    - "Organize types in separate .d.ts files when appropriate"
  
  style:
    - "Use PascalCase for types and interfaces"
    - "Use camelCase for variables and functions"
    - "Prefix interfaces with 'I' only if team convention requires"
    - "Use 'interface' for object shapes, 'type' for unions/intersections"
  
  best_practices:
    - "Avoid 'any' - use 'unknown' if type is truly unknown"
    - "Use 'as const' for literal types"
    - "Prefer union types over enums when possible"
    - "Use 'satisfies' operator for type checking without widening"

# Training Guidelines
training:
  data_sources:
    - "TypeScript official documentation"
    - "TypeScript GitHub repository"
    - "Definitely Typed repository"
    - "TypeScript Deep Dive book"
    - "TypeScript release notes"
  
  focus_areas:
    - "Type system mechanics"
    - "Generic type patterns"
    - "Utility type implementation"
    - "Compiler options effects"
  
  evaluation_metrics:
    - "Type safety"
    - "Type coverage percentage"
    - "Appropriate type complexity"
    - "Proper generic usage"

# Pipeline Instructions
pipeline:
  preprocessing:
    - "Parse TypeScript syntax tree"
    - "Identify type dependencies"
    - "Extract generic parameters"
  
  processing:
    - "Apply type transformations"
    - "Resolve type aliases"
    - "Check type compatibility"
  
  postprocessing:
    - "Format type definitions"
    - "Organize imports"
    - "Generate type documentation"

# Error Handling
error_handling:
  common_errors:
    - error: "Type 'any' usage"
      action: "Replace with specific type or 'unknown'"
    
    - error: "Implicit any"
      action: "Add explicit type annotation"
    
    - error: "Type assertion abuse"
      action: "Use type guards or proper types instead"
    
    - error: "Missing return type"
      action: "Add explicit return type annotation"
  
  recovery_strategies:
    - "Consult TypeScript handbook via URL lookup"
    - "Check type definitions in Definitely Typed"
    - "Use TypeScript playground for testing"
    - "Review compiler error messages"

# URL Lookup Configuration
url_lookup_config:
  primary_sources:
    - name: "TypeScript Handbook"
      url: "https://www.typescriptlang.org/docs/handbook"
      use_for: ["type system", "concepts", "patterns"]
    
    - name: "TypeScript GitHub"
      url: "https://github.com/microsoft/TypeScript"
      use_for: ["issues", "roadmap", "source code"]
    
    - name: "Definitely Typed"
      url: "https://github.com/DefinitelyTyped/DefinitelyTyped"
      use_for: ["type definitions", "third-party types"]
  
  reference_triggers:
    - "When encountering complex type errors"
    - "For utility type usage examples"
    - "To verify TypeScript version features"
    - "For compiler option documentation"

# Admin Integration
admin_config:
  editable_fields:
    - "domain.version"
    - "principles"
    - "tools.url_lookup.sources"
    - "url_lookup_config.primary_sources"
  
  training_sources_management:
    enabled: true
    auto_update: true
    fields:
      - "training.data_sources"
      - "url_lookup_config"
