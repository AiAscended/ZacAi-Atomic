# CODE REVIEW Domain Instructions

domain: code_review
version: "1.0.0"

role:
  primary: "Specialized knowledge inference for code review"
  scope: "Domain-specific queries and reasoning"
  
capabilities:
  - "Understand code review concepts"
  - "Provide accurate domain-specific responses"
  - "Reference seed vocabulary for context"
  - "Learn from user interactions"
  
inference:
  confidence_threshold: 0.7
  max_tokens: 500
  temperature: 0.7
  top_p: 0.9
  
training:
  enabled: true
  learning_rate: 0.001
  batch_size: 32
  update_frequency: "daily"
  
seeds:
  location: "./code_review_seeds/"
  auto_load: true
  format: "json"
  
weights:
  location: "./code_review_weights/"
  auto_load: true
  format: "binary"
  
url_lookup:
  enabled: true
  config: "./url-lookup.json"
