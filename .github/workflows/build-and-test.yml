name: Build & Test Kernel System

on:
  push:
    branches: [ main, "Ultimate-Hybrid-Ai-System-Bootstrap" ]
  pull_request:
    branches: [ main ]

jobs:
  build-rust-wasm:
    name: Build Rust to WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Build kernel methods to WASM
        run: |
          cd packages/system-kernel-methods/rust
          wasm-pack build --release --target web --out-dir ../wasm_dist

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v3
        with:
          name: kernel-wasm-dist
          path: packages/system-kernel-methods/wasm_dist/
          retention-days: 30

  test-compliance:
    name: Test Compliance Utilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run compliance tests
        run: |
          node tools/test_compliance.js

  test-kernel-fallback:
    name: Test Kernel Fallback (JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run kernel fallback test
        run: |
          node packages/system-kernel-methods/ts/kernel_test_fallback.js

  build-and-lint:
    name: Build TypeScript Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --recursive --no-frozen-lockfile || true

      - name: Build packages
        run: npm run build:packages || true

      - name: Run tests
        run: npm test || true

  integration-test:
    name: Integration Test (WASM + TS)
    runs-on: ubuntu-latest
    needs: [ build-rust-wasm ]
    steps:
      - uses: actions/checkout@v4

      - name: Download WASM artifacts
        uses: actions/download-artifact@v3
        with:
          name: kernel-wasm-dist
          path: packages/system-kernel-methods/wasm_dist/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Verify WASM artifacts exist
        run: |
          ls -la packages/system-kernel-methods/wasm_dist/

      - name: Run compliance test with WASM available
        run: |
          node tools/test_compliance.js
